# Milestone Life — iOS build on Codemagic (no local Mac required)
#
# BEFORE FIRST BUILD — Codemagic Team settings:
# 1. Team integrations → Developer Portal → Add key
#    - Name it anything (e.g. "Milestone Life ASC") — NOT "codemagic"
#    - Upload App Store Connect API .p8 key + Issuer ID + Key ID
# 2. codemagic.yaml settings → Code signing identities
#    - Fetch or generate App Store distribution certificate
#    - Fetch App Store provisioning profile for com.dgator86.milestonelife
#
# AFTER IPA BUILDS — enable TestFlight upload:
# - Uncomment `integrations` + `publishing` below
# - Replace YOUR_APP_STORE_CONNECT_KEY_NAME with the exact name from step 1

workflows:
  milestone-life-ios:
    name: Milestone Life iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dgator86.milestonelife
      vars:
        CAPACITOR_SERVER_URL: https://milestone-red.vercel.app
        BUNDLE_ID: com.dgator86.milestonelife
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        # Set in Codemagic UI when enabling TestFlight auto-upload:
        # APP_STORE_APPLE_ID: "1234567890"
      node: 20
      xcode: latest
      cocoapods: default
    # Uncomment after adding Apple Developer Portal key in Codemagic UI:
    # integrations:
    #   app_store_connect: YOUR_APP_STORE_CONNECT_KEY_NAME
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: Main-Branch
          include: true
    scripts:
      - name: Install web dependencies
        script: npm ci
      - name: Install Capacitor shell
        script: |
          cd mobile
          npm ci
      - name: Add iOS platform and sync
        script: |
          cd mobile
          npx cap add ios
          CAPACITOR_SERVER_URL="$CAPACITOR_SERVER_URL" npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd mobile/ios/App
          pod install
      - name: Set up code signing
        script: xcode-project use-profiles --project mobile/ios/App/App.xcodeproj
      - name: Set iOS build number
        script: |
          cd mobile/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build ipa for App Store
        script: |
          cd mobile/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - djvogeli@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment after integrations block is configured with your real key name:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      #   submit_to_app_store: false
