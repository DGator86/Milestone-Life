# Milestone Life — iOS build on Codemagic (no local Mac required)
#
# REQUIRED in Codemagic Team settings:
# 1. Team integrations → Developer Portal → Add key
#    - Name it exactly: Milestone Life ASC
#    - Issuer ID, Key ID, and .p8 file from App Store Connect
# 2. Apple Developer Program enrolled ($99/year)
#
# This workflow CREATES the bundle ID, certificate, and App Store profile
# automatically — you do not need to upload profiles manually.

workflows:
  milestone-life-ios:
    name: Milestone Life iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Must match the API key name in Codemagic Team integrations exactly.
      app_store_connect: Milestone Life ASC
    environment:
      vars:
        CAPACITOR_SERVER_URL: https://milestone-red.vercel.app
        BUNDLE_ID: com.dgator86.milestonelife
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: Main-Branch
          include: true
    scripts:
      - name: Install web dependencies
        script: npm ci
      - name: Install Capacitor shell
        script: |
          cd mobile
          npm ci
      - name: Add iOS platform and sync
        script: |
          cd mobile
          npx cap add ios
          CAPACITOR_SERVER_URL="$CAPACITOR_SERVER_URL" npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd mobile/ios/App
          pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch or create signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing
        script: xcode-project use-profiles --project mobile/ios/App/App.xcodeproj
      - name: Set iOS build number
        script: |
          cd mobile/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build ipa for App Store
        script: |
          cd mobile/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - djvogeli@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment after first successful IPA build:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
      #   submit_to_app_store: false
